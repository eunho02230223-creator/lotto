<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTO 6/45 · FINAL PICK</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--text:#f4f5f7;--muted:#9ca3af;--line:#252b33;--accent:#d9b56d}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 15%,#1a1d22 0,#0b0d10 48%,#070809 100%);color:var(--text);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
main{min-height:100vh;display:grid;place-items:center;padding:28px}
.card{width:min(920px,100%);background:rgba(17,21,26,.92);border:1px solid var(--line);border-radius:28px;padding:54px 32px 36px;box-shadow:0 30px 90px rgba(0,0,0,.42);text-align:center}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--accent);font-weight:700}.title{margin:13px 0 7px;font-size:clamp(31px,6vw,52px);letter-spacing:-.04em}.sub{color:var(--muted);font-size:16px}
.balls{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:42px auto 27px}.ball{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#dfe3e8);color:#111;font-size:25px;font-weight:800;box-shadow:inset -7px -8px 14px rgba(0,0,0,.12),inset 5px 5px 10px rgba(255,255,255,.8),0 12px 28px rgba(0,0,0,.25)}
.label{font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}.desc{margin-top:10px;font-size:15px;color:#c8cdd4}
button{margin-top:30px;border:1px solid #3b424c;background:#e9eaec;color:#101214;padding:14px 24px;border-radius:999px;font-weight:800;cursor:pointer;transition:.2s}button:hover{transform:translateY(-1px);background:#fff}
.status{margin:22px auto 0;max-width:760px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.6;display:none;text-align:left;white-space:pre-wrap}
.error{border-color:#713b3b;color:#ffb4b4}.foot{margin-top:32px;color:#656d78;font-size:11px;line-height:1.6}
input{display:none}
@media(max-width:620px){.card{padding:42px 18px 30px}.ball{width:61px;height:61px;font-size:20px}.balls{gap:9px;margin-top:32px}}
</style>
</head>
<body>
<main><section class="card">
<div class="eyebrow">LOTTO 6/45</div>
<h1 class="title" id="round">FINAL PICK</h1>
<div class="sub">이번 회차 최종 추천</div>
<div class="balls" id="balls"></div>
<div class="label">FINAL AUTO PICK</div>
<div class="desc">엑셀 통계분석 시스템이 선정한 최종 1순위 조합</div>
<button id="refresh">FINAL PICK 확인</button>
<div class="status" id="status"></div>
<div class="foot">표시되는 번호는 원본 Excel의 <b>FINAL_자동발급</b> 시트 1순위 행을 그대로 사용합니다.<br>웹페이지에서 번호를 새로 계산하거나 예측하지 않습니다.</div>
</section></main>
<script>
const DATA_URL = "data/원본엑셀.xlsx";
const $ = id => document.getElementById(id);
function showStatus(msg, error=false){$("status").style.display="block";$("status").className="status"+(error?" error":"");$("status").textContent=msg;}
function normalize(s){return String(s??"").trim().toLowerCase().replace(/\s+/g,"").replace(/[_\-./()]/g,"");}
function num(v){if(typeof v==="number" && Number.isFinite(v)) return v; const n=Number(String(v??"").replace(/,/g,"").trim()); return Number.isFinite(n)?n:null;}
function findHeader(rows, candidates){
  for(let r=0;r<Math.min(rows.length,30);r++){
    const row=rows[r]||[];
    const norm=row.map(normalize);
    let hits=0; for(const c of candidates) if(norm.includes(normalize(c))) hits++;
    if(hits>=candidates.length) return {r,row,norm};
  }
  return null;
}
function findCol(norm, candidates){
  for(const c of candidates){const i=norm.indexOf(normalize(c)); if(i>=0)return i;}
  return -1;
}
function parseFinal(rows){
  const h=findHeader(rows,[ "순번","N1","N2","N3","N4","N5","N6"]);
  if(!h) throw new Error("FINAL_자동발급에서 '순번/N1~N6' 헤더를 찾지 못했습니다.");
  const rankCol=findCol(h.norm,["순번","Rank","순위"]);
  const ncols=["N1","N2","N3","N4","N5","N6"].map((x,i)=>findCol(h.norm,[x,"번호"+(i+1),"Number "+(i+1),"Number"+(i+1)]));
  if(rankCol<0 || ncols.some(i=>i<0)) throw new Error("FINAL_자동발급의 순번 또는 6개 번호 열을 찾지 못했습니다.");
  for(let r=h.r+1;r<rows.length;r++){
    const row=rows[r]||[], rank=num(row[rankCol]);
    if(rank===1){
      const nums=ncols.map(i=>num(row[i]));
      if(nums.some(n=>n===null)) throw new Error("FINAL_자동발급 1순위 행의 번호 중 숫자로 읽히지 않는 값이 있습니다.");
      if(nums.length!==6 || nums.some(n=>!Number.isInteger(n)||n<1||n>45)) throw new Error("1순위 조합의 번호가 1~45 정수 범위를 벗어났습니다.");
      if(new Set(nums).size!==6) throw new Error("1순위 조합에 중복 번호가 있습니다.");
      return nums;
    }
  }
  throw new Error("FINAL_자동발급에서 순번=1인 행을 찾지 못했습니다.");
}
function parseLatest(rows){
  const h=findHeader(rows,["회차"]);
  if(!h) throw new Error("회차 데이터에서 '회차' 헤더를 찾지 못했습니다.");
  const c=findCol(h.norm,["회차"]);
  let latest=null;
  for(let r=h.r+1;r<rows.length;r++){const n=num((rows[r]||[])[c]); if(Number.isInteger(n)&&n>0) latest=Math.max(latest??0,n);}
  if(latest===null) throw new Error("최신 회차를 찾지 못했습니다.");
  return latest;
}
async function load(){
  try{
    showStatus("Excel 데이터를 불러오는 중입니다…");
    const res=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("data/원본엑셀.xlsx를 불러오지 못했습니다. GitHub 저장소의 data 폴더에 파일이 있는지 확인하세요.");
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});
    if(!wb.SheetNames.includes("FINAL_자동발급")) throw new Error("FINAL_자동발급 시트가 없습니다.");
    const finalRows=XLSX.utils.sheet_to_json(wb.Sheets["FINAL_자동발급"],{header:1,defval:null,raw:true});
    const dataSheet=wb.SheetNames.includes("로또데이터")?"로또데이터":null;
    if(!dataSheet) throw new Error("최신 회차를 확인할 '로또데이터' 시트가 없습니다.");
    const dataRows=XLSX.utils.sheet_to_json(wb.Sheets[dataSheet],{header:1,defval:null,raw:true});
    const nums=parseFinal(finalRows), latest=parseLatest(dataRows), next=latest+1;
    $("round").textContent=next+"회 FINAL PICK";
    $("balls").innerHTML=nums.map(n=>`<div class="ball">${String(n).padStart(2,"0")}</div>`).join("");
    showStatus("정상 확인 완료 · "+next+"회 · FINAL_자동발급 1순위 · "+nums.join(" · "));
  }catch(e){$("round").textContent="FINAL PICK";$("balls").innerHTML="";showStatus("최종 조합 데이터를 불러올 수 없습니다.\n원인: "+e.message,true);}
}
$("refresh").addEventListener("click",load); load();
</script>
</body>
</html>
