<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<title>LOTTO 6/45 · FINAL PICK</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#080a0d; --panel:#101318; --line:rgba(255,255,255,.10);
    --text:#f4f6f8; --muted:#9ca3ad; --accent:#d7b56d;
    --shadow:0 30px 80px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:
    radial-gradient(circle at 50% 20%,rgba(215,181,109,.09),transparent 32rem),var(--bg);color:var(--text)}
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  .shell{width:min(980px,100%);min-height:min(760px,calc(100vh - 48px));display:flex;align-items:center;justify-content:center}
  .card{width:100%;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
    border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:clamp(34px,7vw,78px) clamp(22px,6vw,72px);text-align:center;position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;inset:-1px;background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.04),transparent 55%);pointer-events:none}
  .brand{font-size:12px;letter-spacing:.38em;color:#c9cdd3;margin-left:.38em;font-weight:700}
  .eyebrow{margin-top:34px;color:var(--accent);font-size:14px;letter-spacing:.16em;font-weight:700}
  h1{font-size:clamp(28px,5vw,48px);line-height:1.1;margin:13px 0 0;font-weight:600;letter-spacing:-.035em}
  .sub{color:var(--muted);font-size:14px;margin-top:16px}
  .balls{display:flex;justify-content:center;gap:clamp(9px,2.2vw,18px);flex-wrap:wrap;margin:42px auto 32px}
  .ball{width:clamp(52px,8vw,78px);height:clamp(52px,8vw,78px);border-radius:50%;display:grid;place-items:center;
    font-size:clamp(18px,3vw,25px);font-weight:700;letter-spacing:-.02em;
    border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 2px 8px rgba(255,255,255,.16),0 10px 28px rgba(0,0,0,.35)}
  .b1{background:linear-gradient(145deg,#d7b85e,#a47c23)}
  .b2{background:linear-gradient(145deg,#79a8d8,#3c6797)}
  .b3{background:linear-gradient(145deg,#d87979,#9c3f45)}
  .b4{background:linear-gradient(145deg,#a9afb8,#646b76)}
  .b5{background:linear-gradient(145deg,#78ad82,#3c7047)}
  .label{font-size:12px;color:var(--muted);letter-spacing:.22em;font-weight:700}
  button{margin-top:28px;border:1px solid rgba(215,181,109,.45);background:rgba(215,181,109,.10);color:#f1dfb7;
    padding:14px 24px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.02em;cursor:pointer;
    transition:.2s transform,.2s background,.2s border-color}
  button:hover{transform:translateY(-1px);background:rgba(215,181,109,.17);border-color:rgba(215,181,109,.75)}
  button:active{transform:translateY(0)}
  .error{max-width:620px;margin:34px auto 0;padding:18px 20px;border:1px solid rgba(221,96,96,.35);border-radius:18px;background:rgba(221,96,96,.07);color:#f2c5c5;font-size:14px;line-height:1.65}
  .pick-file{display:none;margin-top:14px}
  .pick-file input{display:none}
  .pick-file label{display:inline-block;color:#d9dde2;text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:13px}
  .footer{margin-top:38px;color:#727984;font-size:11px;letter-spacing:.04em}
  .loading{color:var(--muted);font-size:14px;margin-top:45px}
  .hidden{display:none!important}
  @media(max-width:600px){
    body{padding:12px}.card{border-radius:24px;min-height:calc(100vh - 24px);padding-top:54px}
    .balls{max-width:330px}.footer{margin-top:30px}
  }
</style>
</head>
<body>
<main class="shell">
  <section class="card" aria-live="polite">
    <div class="brand">LOTTO 6/45</div>
    <div id="loading" class="loading">최종 조합 데이터를 확인하는 중…</div>

    <div id="content" class="hidden">
      <div class="eyebrow">이번 회차 최종 추천</div>
      <h1 id="roundTitle">—회 FINAL PICK</h1>
      <div id="balls" class="balls"></div>
      <div class="label">FINAL AUTO PICK</div>
      <div class="sub">엑셀 통계분석 시스템이 선정한 최종 1순위 조합</div>
      <button id="reloadBtn" type="button">FINAL PICK 확인</button>
      <div class="footer">번호는 <strong>FINAL_자동발급</strong> 시트의 1순위 행을 그대로 표시합니다.</div>
    </div>

    <div id="error" class="error hidden"></div>
    <div id="filePicker" class="pick-file">
      <label for="fileInput">원본 Excel 파일 선택</label>
      <input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls">
    </div>
  </section>
</main>

<script>
"use strict";

const DATA_URL = "data/원본엑셀.xlsx";
let selectedFile = null;

const $ = id => document.getElementById(id);

function norm(v){
  return String(v ?? "").trim().toLowerCase().replace(/[\\s_\\-()\\[\\]{}:·.]/g,"");
}
function num(v){
  if(typeof v === "number" && Number.isFinite(v)) return v;
  const n = Number(String(v ?? "").replace(/,/g,"").trim());
  return Number.isFinite(n) ? n : NaN;
}
function showError(message, allowFile=true){
  $("loading").classList.add("hidden");
  $("content").classList.add("hidden");
  $("error").classList.remove("hidden");
  $("error").textContent = message;
  $("filePicker").style.display = allowFile ? "block" : "none";
}
function findHeaderRow(rows){
  for(let r=0;r<Math.min(rows.length,15);r++){
    const vals = rows[r].map(norm);
    const rank = vals.findIndex(x => ["순번","순위","rank"].includes(x));
    const nums = [];
    for(let i=1;i<=6;i++){
      nums.push(vals.findIndex(x => [("n"+i),("번호"+i),("number"+i),("number"+i.toString())].includes(x)));
    }
    if(rank >= 0 && nums.every(i => i >= 0)) return {row:r,rank,nums};
  }
  return null;
}
function findFinalPick(workbook){
  const ws = workbook.Sheets["FINAL_자동발급"];
  if(!ws) throw new Error("FINAL_자동발급 시트를 찾을 수 없습니다.");
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const h = findHeaderRow(rows);
  if(!h) throw new Error("FINAL_자동발급의 순번/번호1~번호6 열 구조를 인식하지 못했습니다.");

  for(let r=h.row+1;r<rows.length;r++){
    const rank = num(rows[r][h.rank]);
    if(rank === 1){
      const nums = h.nums.map(c => num(rows[r][c]));
      validateNumbers(nums);
      return nums.map(n => Math.trunc(n));
    }
  }
  throw new Error("FINAL_자동발급에서 1순위 행을 찾지 못했습니다.");
}
function validateNumbers(nums){
  if(nums.length !== 6) throw new Error("최종 조합이 정확히 6개가 아닙니다.");
  if(nums.some(n => !Number.isInteger(n) || n < 1 || n > 45)) throw new Error("최종 조합에 1~45 범위를 벗어난 번호가 있습니다.");
  if(new Set(nums).size !== 6) throw new Error("최종 조합에 중복 번호가 있습니다.");
}
function findLatestRound(workbook){
  let best = -Infinity;
  for(const name of workbook.SheetNames){
    const ws = workbook.Sheets[name];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    if(!rows.length) continue;
    for(let r=0;r<Math.min(rows.length,15);r++){
      const headers = rows[r].map(norm);
      const roundCol = headers.findIndex(x => ["회차","round","draw","drawno","drawnumber"].includes(x));
      if(roundCol < 0) continue;

      const numberCols = [];
      for(let i=1;i<=6;i++){
        const c = headers.findIndex(x => [("번호"+i),("number"+i),("n"+i)].includes(x));
        if(c >= 0) numberCols.push(c);
      }
      if(numberCols.length !== 6) continue;

      for(let rr=r+1;rr<rows.length;rr++){
        const round = num(rows[rr][roundCol]);
        const nums = numberCols.map(c => num(rows[rr][c]));
        if(Number.isInteger(round) && round >= 1 && nums.every(n => Number.isInteger(n) && n>=1 && n<=45)){
          if(round > best) best = round;
        }
      }
    }
  }
  if(!Number.isFinite(best)) throw new Error("최신 회차를 확인할 수 없습니다.");
  return Math.trunc(best);
}
function render(round, nums){
  $("loading").classList.add("hidden");
  $("error").classList.add("hidden");
  $("filePicker").style.display = "none";
  $("content").classList.remove("hidden");
  $("roundTitle").textContent = `${round}회 FINAL PICK`;
  $("balls").innerHTML = "";
  nums.forEach((n,i)=>{
    const el = document.createElement("div");
    el.className = `ball b${i+1}`;
    el.textContent = String(n).padStart(2,"0");
    el.setAttribute("aria-label",`${n}번`);
    $("balls").appendChild(el);
  });
}
async function parseBuffer(buffer){
  if(typeof XLSX === "undefined") throw new Error("Excel 읽기 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  const wb = XLSX.read(buffer,{type:"array",cellDates:true});
  const nums = findFinalPick(wb);
  const latest = findLatestRound(wb);
  const next = latest + 1;
  render(next,nums);
  return {latest,next,nums};
}
async function loadFromUrl(){
  $("loading").classList.remove("hidden");
  $("error").classList.add("hidden");
  $("content").classList.add("hidden");
  $("filePicker").style.display = "none";
  try{
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`,{cache:"no-store"});
    if(!res.ok) throw new Error(`Excel 파일을 불러오지 못했습니다. (HTTP ${res.status})`);
    await parseBuffer(await res.arrayBuffer());
  }catch(e){
    showError(e.message || "Excel 데이터를 불러오지 못했습니다.", true);
  }
}
async function loadFromFile(file){
  selectedFile = file;
  try{
    await parseBuffer(await file.arrayBuffer());
  }catch(e){
    showError(e.message || "Excel 파일을 분석하지 못했습니다.", true);
  }
}
$("fileInput").addEventListener("change", e=>{
  const f=e.target.files?.[0];
  if(f) loadFromFile(f);
});
$("reloadBtn").addEventListener("click",()=>{
  if(selectedFile) loadFromFile(selectedFile);
  else loadFromUrl();
});

if(location.protocol === "file:"){
  showError("브라우저 보안상 로컬 HTML은 같은 폴더의 Excel을 자동으로 읽을 수 없습니다. 아래에서 원본 Excel을 한 번 선택해 주세요.", true);
}else{
  loadFromUrl();
}
</script>
</body>
</html>
